<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Buy | Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #7c3aed, #f97316);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon {
            width: 55px;
            height: 55px;
            background: #7c3aed;
            color: white;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin: 0 auto 12px;
        }

        h1 {
            color: #7c3aed;
            font-size: 27px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #3b245e;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f97316;
        }

        .message {
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            background: #fef2f2;
            color: #dc2626;
        }

        .success {
            background: #f0fdf4;
            color: #15803d;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .login-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <div class="icon">🔐</div>
            <h1>Smart Buy</h1>
            <p class="subtitle">
                Admin Forgot Password<br>
                Reset your account password
            </p>
        </div>

        {% if error %}
        <div class="message">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="message success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{url_for('admin_forgot_password')}}">
            

            <div class="form-group">
                <label for="email">Registered Admin Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter registered email"
                    required>
            </div>
            
            {% if message %}
            <p style="color:red;">{{messgae}}</p>
            {% endif %}

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="8"
                    required>
            </div>

            <button type="submit">Send OTP</button>

        </form>

        <div class="login-link">
            Remembered your password?
            <a href="/admin-login">Admin Login</a>
        </div>

    </div>

</body>
</html>
