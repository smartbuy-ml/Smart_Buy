<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Buy | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #7c3aed, #f97316);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            background: #7c3aed;
            color: white;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
            margin: 0 auto 12px;
        }

        h1 {
            color: #7c3aed;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #3b245e;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 4px #c4b5fd;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f97316;
        }

        .forgot-link {
            text-align: right;
            margin: -5px 0 18px;
            font-size: 13px;
        }

        .forgot-link a,
        .register-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
            margin-top: 12px;
            text-align: right;
            display: block;
            
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .message {
            color: #dc2626;
            background: #fef2f2;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .back-link {
            display: block;
            width: fit-content;
            margin: 20px auto;
            text-align: center;
            text-decoration: none;
        }

        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            box-sizing: border-box;
        }

        .password-box span {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
            
    </style>
</head>

<body>

    <div class="login-container">



        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>Smart Buy</h1>
            <p class="subtitle">Admin Login</p>
        </div>

        {% if error %}
        <div class="message">{{ error }}</div>
        {% endif %}

        <form action="/admin-login" method="POST">

           


            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required>
            </div>

            <label>Password</label>
            <div class="password-box">
                <input type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

               

                <span onclick="togglePassword()" id="eyeIcon">
                    <svg width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </span>
            </div>

            <div class="forgot-link">
                <a href="/admin-forgot-password">Forgot Password?</a>
            </div>

            <p>
               <a href="admin-register">Registration</a>
            </p> 
            
            <button type="submit">Login</button>

        </form>

            <a href="\" class="back-link">
            Back to Dashboard
            </a>

             

    </div>
    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eye.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 3l18 18"/>
                        <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.2 4.1"/>
                        <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
                    </svg>`;
            } else {
                password.type = "password";
                eye.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>`;
            }
        }
</script>   

</body>
</html>
