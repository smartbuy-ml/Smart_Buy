<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | Smart Buy</title>

    <style>
        body {
            font-family: Arial;
            background: #F3E8FF;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 350px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #7C3AED;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p>Create your new admin password.</p>
    {% if message %}
    <p style="color:red;">{{message}}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_reset_password') }}">

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required
        >

        <button type="submit">Update Password</button>

    </form>

</div>

</body>
</html>
