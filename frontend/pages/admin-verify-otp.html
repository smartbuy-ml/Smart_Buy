<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP | Smart Buy</title>

    <style>
        body {
            font-family: Arial;
            background: #F3E8FF;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 350px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #7C3AED;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Verify OTP</h2>

    <p>Enter the 6-digit OTP sent to your email.</p>
    {% if message %}
    <p style="color:red;">{{message}}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_verify_otp') }}">

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            required
        >

        <button type="submit">Verify OTP</button>

    </form>

</div>

</body>
</html>
