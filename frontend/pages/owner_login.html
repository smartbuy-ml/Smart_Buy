<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Buy - Owner Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #F3E8FF, #FFF0E0);
            color: #3B245E;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #7C3AED25;
        }

        h1 {
            text-align: center;
            color: #7C3AED;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #4C1D95;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #D8B4FE;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            background: linear-gradient(90deg, #7C3AED, #F97316);
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #7C3AED;
            text-decoration: none;
            font-weight: bold;
        }
        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 8px;
            color: #7C3AED;
            text-decoration: none;
        }
        
    </style>
</head>

<body>
    <div class="login-box">
        <h1>🛍️ Smart Buy</h1>
        <p class="subtitle">Owner Login</p>

        <form action="/owner-login" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <a href="{{ url_for('owner_forgot_password') }}">
            Forgot Password?
        </a>

        <p>Don't have an account?
            <a href="/owner-register">Registration</a>
        </p>

        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
